<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Nigerian Law Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Nigerian Law Portal</h1>
            <p class="text-sm text-slate-500 mt-1">Create an account to access statutory laws</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm text-center
                        {% if category == 'danger' %} bg-red-100 text-red-700 border border-red-200
                        {% elif category == 'warning' %} bg-amber-100 text-amber-700 border border-amber-200
                        {% else %} bg-emerald-100 text-emerald-700 border border-emerald-200 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Registration Form -->
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" name="full_name" required placeholder="e.g. Amina Bello"
                    class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com"
                    class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <button type="submit" 
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition-all shadow-sm">
                Create Account
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-500">
                Already have an account? 
                <a href="/login" class="text-emerald-700 font-bold hover:underline">Log in here</a>
            </p>
        </div>

    </div>

</body>
</html>
