<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Nigerian Law Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 p-8 my-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <a href="/" class="text-2xl font-bold text-slate-900 inline-flex items-center gap-2">
                <span>📜</span> Nigerian Law Portal
            </a>
            <p class="text-sm text-slate-500 mt-1">Sign in to your account</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm text-center
                        {% if category == 'danger' %} bg-red-100 text-red-700 border border-red-200
                        {% elif category == 'info' %} bg-blue-100 text-blue-700 border border-blue-200
                        {% else %} bg-emerald-100 text-emerald-700 border border-emerald-200 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com"
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                    <button type="button" onclick="toggleVisibility('password')" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition-all shadow-sm">
                Sign In
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-500">
                Don't have an account? 
                <a href="/register" class="text-emerald-700 font-bold hover:underline">Register here</a>
            </p>
        </div>

    </div>

    <script>
        function toggleVisibility(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>

</body>
</html>
